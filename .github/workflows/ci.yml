name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_QUIET: "true" # F.I.R.S.T. principle (only print failures, not test names)
  RUSTFLAGS: -Dwarnings
  # Stripped release binary ceiling on linux-x86_64. The strategic "fits
  # on a robot" moat is the aarch64 target — enforced by the separate
  # `binary-size-aarch64` job below (musl cross-build, 9MB gate). Linux
  # x86_64 reality has always run ~10MB even with
  # `profile.release.strip = true`. Escape valve for genuine new heavy
  # deps is feature-gating, not bumping either number.
  BINARY_SIZE_LIMIT_MB: 11
  # Stripped release binary ceiling on aarch64-unknown-linux-musl — the
  # actual robot deployment target (Pi/Jetson-class Linux arm64). First
  # CI measurement: 8.21 MB (musl cross-compile saves ~22% vs x86_64's
  # 10.56 MB, less than the issue's ~7 MB estimate). Headroom ~9%,
  # mirroring the x86_64 gate style. Trimming toward 7 MB is a separate
  # follow-up. Same escape valve: feature-gate heavy deps, don't bump
  # this number without team sign-off.
  BINARY_SIZE_LIMIT_AARCH64_MB: 9

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@3771e22aa892e03fd35585fae288baad1755695c # v2.78.2
        with:
          tool: nextest
      - run: cargo nextest run --lib
      - run: cargo nextest run --bin zeptoclaw
      - run: cargo nextest run --test cli_smoke
      - run: cargo nextest run --test integration
      - run: cargo nextest run --test e2e
      - run: cargo test --doc
      - name: Test with memory-bm25 feature
        run: cargo nextest run --lib --features memory-bm25
      - name: Test with hardware features (ESP32)
        run: cargo nextest run --lib --features peripheral-esp32

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo clippy -- -D warnings
      - name: Clippy with hardware features
        run: cargo clippy --features peripheral-esp32 -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: EmbarkStudios/cargo-deny-action@6c8f9facfa5047ec02d8485b6bf52b587b7777d1 # v2.0.18

  feature-matrix:
    name: Feature gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - "--features memory-embedding"
          - "--features screenshot"
          - "--features panel"
          - "--features tool-pdf"
          - "--features memory-hnsw"
          - "--features channel-email"
          - "--features google"
          - "--features provider-vertex"
          - "--features whatsapp-web"
          - "--features hardware"
          - "--features peripheral-rpi"
          - "--features probe"
          - "--features android"
          - "--features sandbox-landlock"
          - "--features sandbox-firejail"
          - "--features sandbox-bubblewrap"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: features-${{ matrix.features }}
      - name: Check compilation
        run: cargo check ${{ matrix.features }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: coverage
      - uses: taiki-e/install-action@3771e22aa892e03fd35585fae288baad1755695c # v2.78.2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Generate code coverage
        run: cargo llvm-cov nextest --lib --features memory-bm25 --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

  # Heavy checks that only run on main merges
  riscv64-smoke:
    name: RISC-V smoke test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Dwarnings --cfg getrandom_backend="linux_raw"
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_LINKER: riscv64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-linux-musl
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: riscv64
      - name: Install QEMU and cross-linker
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user gcc-riscv64-linux-gnu
      - name: Cross-compile smoke test
        run: cargo build --release --target riscv64gc-unknown-linux-musl --example riscv_smoke
      - name: Run under QEMU
        run: |
          qemu-riscv64 -L /usr/riscv64-linux-gnu \
            target/riscv64gc-unknown-linux-musl/release/examples/riscv_smoke
          echo "### RISC-V smoke test passed (Uuid::new_v4 ok)" >> "$GITHUB_STEP_SUMMARY"

  binary-size:
    name: Binary size
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: binary-size
      - run: cargo build --release
      - name: Check binary size
        run: |
          size_bytes=$(stat --format=%s target/release/zeptoclaw)
          size_mb=$(awk "BEGIN {printf \"%.2f\", ${size_bytes}/1048576}")
          limit_bytes=$(awk "BEGIN {printf \"%d\", ${BINARY_SIZE_LIMIT_MB}*1048576}")
          echo "Binary size: ${size_mb} MB (limit: ${BINARY_SIZE_LIMIT_MB} MB)"
          echo "### Binary size: ${size_mb} MB (limit ${BINARY_SIZE_LIMIT_MB} MB)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${size_bytes}" -gt "${limit_bytes}" ]; then
            echo "::error::Binary exceeds ${BINARY_SIZE_LIMIT_MB} MB limit (${size_mb} MB > ${BINARY_SIZE_LIMIT_MB} MB). Either gate the offending dep behind a Cargo feature or reduce footprint — do not bump the budget without team sign-off." >&2
            exit 1
          fi

  binary-size-aarch64:
    name: Binary size (aarch64)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: binary-size-aarch64
      - name: Install cross-linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo build --release --target aarch64-unknown-linux-musl --bin zeptoclaw
      - name: Check binary size
        run: |
          size_bytes=$(stat --format=%s target/aarch64-unknown-linux-musl/release/zeptoclaw)
          size_mb=$(awk "BEGIN {printf \"%.2f\", ${size_bytes}/1048576}")
          limit_bytes=$(awk "BEGIN {printf \"%d\", ${BINARY_SIZE_LIMIT_AARCH64_MB}*1048576}")
          echo "Binary size (aarch64): ${size_mb} MB (limit: ${BINARY_SIZE_LIMIT_AARCH64_MB} MB)"
          echo "### Binary size (aarch64): ${size_mb} MB (limit ${BINARY_SIZE_LIMIT_AARCH64_MB} MB)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${size_bytes}" -gt "${limit_bytes}" ]; then
            echo "::error::aarch64 binary exceeds ${BINARY_SIZE_LIMIT_AARCH64_MB} MB limit (${size_mb} MB > ${BINARY_SIZE_LIMIT_AARCH64_MB} MB). Either gate the offending dep behind a Cargo feature or reduce footprint — do not bump the budget without team sign-off." >&2
            exit 1
          fi
